<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Apohenia: Sales Quest — a playful adventure that teaches one master sales frame through dialogue, choices and boss battles.">
<title>APOHENIA: SALES QUEST</title>
<link rel="stylesheet" href="assets/css/main.css?v=5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff8a5c'/%3E%3Cpath d='M16 6 L19 13 L26 13 L20.5 17.5 L22.5 25 L16 20.5 L9.5 25 L11.5 17.5 L6 13 L13 13 Z' fill='%23ffd93d'/%3E%3C/svg%3E">
</head>
<body>
<noscript style="color:#fff;font-family:sans-serif;display:block;padding:2em;text-align:center">APOHENIA: SALES QUEST needs JavaScript to play.</noscript>

<div id="app">
  <section id="screen-title" class="screen" aria-label="Title screen"></section>
  <section id="screen-map" class="screen" aria-label="Adventure map">
    <div class="topbar">
      <button class="btn btn-sm" id="map-back">← Title</button>
      <span class="title-chip">🗺 Adventure Map</span>
      <div class="spacer"></div>
      <button class="btn btn-sm btn-gold" id="map-play">▶ Play</button>
      <button class="btn btn-sm btn-blue" id="map-practice">🏋 Practice</button>
      <span class="hud-chip" id="map-hud-stars">⭐ 0</span>
      <span class="hud-chip" id="map-hud-rank">🎖 New Voice</span>
    </div>
    <div class="map-scroll"><div class="map-svg-wrap"></div></div>
  </section>
  <section id="screen-dialogue" class="screen" aria-label="Conversation"></section>
  <section id="screen-practice" class="screen" aria-label="Practice mode"></section>
  <section id="screen-avatar" class="screen" aria-label="Avatar customization"></section>
  <section id="screen-options" class="screen" aria-label="Options"></section>
  <section id="screen-notebook" class="screen" aria-label="Sales notebook"></section>
</div>
<div id="toasts" aria-live="polite"></div>

<!-- content parts (written in parallel; missing files 404 harmlessly) -->
<script src="data/parts/00-meta.js"></script>
<script src="data/parts/10-levels-a.js"></script>
<script src="data/parts/11-levels-b.js"></script>
<script src="data/parts/20-bosses.js"></script>
<script src="data/parts/21-practice.js"></script>
<!-- fallback content fills any missing parts (must load before the merge) -->
<script src="assets/js/mock-data.js"></script>
<!-- merge -->
<script src="data/game-data.js"></script>
<!-- engine + app -->
<script src="assets/js/save.js"></script>
<script src="assets/js/audio.js"></script>
<script src="assets/js/portrait.js"></script>
<script src="assets/js/dialogue.js"></script>
<script src="assets/js/map.js"></script>
<script src="assets/js/practice.js"></script>
<script src="assets/js/app.js"></script>
<script>
/* map topbar wiring (static chrome) */
(function () {
  function refreshHud() {
    var s = document.getElementById("map-hud-stars");
    var r = document.getElementById("map-hud-rank");
    if (s) s.textContent = "⭐ " + SQ.save.totalStars();
    if (r) r.textContent = "🎖 " + SQ.save.rank().name;
  }
  SQ.refreshHud = refreshHud;
  document.getElementById("map-back").addEventListener("click", function () { SQ.audio.sfx("click"); SQ.app.go("title"); });
  document.getElementById("map-practice").addEventListener("click", function () { SQ.audio.sfx("click"); SQ.app.go("practice"); });
  var origGo = SQ.app.go;
  SQ.app.go = function (name) { origGo(name); if (name === "map") refreshHud(); };
})();
</script>
</body>
</html>
